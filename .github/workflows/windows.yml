# Builds and tests the Windows app on a real Windows machine: unit tests, the native recorder,
# a scripted recording, an in-app export of it, and the packaged zip.
name: windows
on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build native recorder
        shell: bash
        run: |
          cd native/win-recorder
          cargo build --release
          cargo test --release   # also writes the contract bundle the TS tests read
          mkdir -p ../bin && cp target/release/recorder.exe ../bin/
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      # From GitHub releases, not Chocolatey: the Chocolatey feed times out (504) now and then and
      # choco still exits 0, which left ffprobe missing until the export check.
      - name: Install ffmpeg (for checks)
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/ffmpeg.zip" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"
          bin="$(dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffprobe.exe | head -1)")"
          "$bin/ffprobe" -version | head -1
          cygpath -w "$bin" >> "$GITHUB_PATH"
      - name: Scripted recording
        shell: pwsh
        run: ./scripts/ci/scripted-recording.ps1 -Recorder native/bin/recorder.exe -Bundle "$env:RUNNER_TEMP\ci.recording"
      - name: Validate recording bundle
        shell: bash
        run: node scripts/validate-bundle.mjs "$RUNNER_TEMP/ci.recording" --expect-clicks 3 --expect-min-seconds 5 --expect-min-moves 100
      - name: Build app and export the recording in-app
        shell: bash
        timeout-minutes: 10
        env:
          # A 9 s recording exports in about 1-2 min on a software renderer.
          SELFTEST_TIMEOUT_S: '240'
        run: |
          node scripts/build.mjs
          # The runner has no GPU: try Windows' WARP adapter first, then SwiftShader.
          ok=0
          for gpu in warp swiftshader; do
            echo "::group::self-test with RECORDER_SOFTWARE_GPU=$gpu"
            if RECORDER_SOFTWARE_GPU=$gpu sh scripts/selftest.sh "$RUNNER_TEMP/ci.recording" "$RUNNER_TEMP/ci-export.mp4" 30 720; then ok=1; fi
            echo "::endgroup::"
            [ $ok = 1 ] && break
          done
          [ $ok = 1 ] || { echo "Export failed with both software GPUs"; exit 1; }
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames:format=duration -of compact "$RUNNER_TEMP/ci-export.mp4"
      - name: Package
        run: npx electron-builder --win zip --x64 --publish never
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: recorder-windows
          path: |
            release/*.zip
            ${{ runner.temp }}/ci.recording
            ${{ runner.temp }}/ci-export.mp4*
